   # ══ NInfer (engine: ninfer) ═══════════════════════════════════════════════════
   # ninfer-v100 (https://github.com/geoffwatts/ninfer-v100) — the sm_70 Volta port of a
   # from-scratch C++/CUDA engine. Both entries below are served by runners/ninfer-server.mjs on
   # target rose-ninfer0 / rose-ninfer1 (see hosts.yaml). Four things differ from every llama.cpp
   # row above, and all four are engine facts rather than choices:
   #
   #   1. `hf_file` is a LOCAL FILENAME, not a file inside `hf_repo`. NInfer serves one
   #      pre-converted single-file .ninfer artifact, staged out of band into the host's
   #      artifact_dir; `hf_repo` here is provenance only and is never fetched.
   #   2. `extra_flags` nulls out batch-size/ubatch-size. Those come from `defaults.extra_flags`
   #      and are llama.cpp spellings — ninfer-serve REJECTS unknown flags at startup, so left
   #      inherited they would fail every launch. (Same reason the OptiQ rows null them.)
   #      NInfer's equivalent knob is --prefill-chunk, defaulted to 2048 by start-server.sh.
   #   3. `think_control: enable_thinking_top`. NInfer takes `enable_thinking` top-level and
   #      returns 400 chat_template_option_not_supported for the nested chat_template_kwargs
   #      spelling the other rows use — VERIFIED live 2026-08-25, not inferred.
   #   4. `no_schema: true`. ninfer-serve supports only response_format {type:text} and 400s
   #      anything else (response_format_not_supported, verified live), which would fail triage /
   #      reasoning / reasoning_hard / reasoning_expert outright. no_schema drops the constraint so
   #      those benches run on free-form output — the same escape hatch the mamba-hybrid rows use,
   #      and it means their JSON-adherence scores are not comparable to a constrained row's.
   #
   # Excluded benches, and why (they are not "not yet run" — they cannot mean anything here):
   #   fit_ctx     — needs llama-fit-params; there is no analytic fit tool, so probeFitCtx returns
   #                 null and the probe self-skips anyway.
   #   kv_per_tok  — measures VRAM delta across two context sizes. Under `--kv-capacity auto` the
   #                 pool always grows to fill free memory minus 1 GiB headroom, so the footprint
   #                 is CONSTANT and the delta is ~0 regardless of context. A zero here would read
   #                 as "free KV", which is the opposite of the truth.
   #   parallel_gen — launches with llama.cpp's `--parallel MAXP` (see the probe), which
   #                 ninfer-serve rejects. Concurrency on this engine is the startup-fixed
   #                 --max-concurrency, so parallel_gen would need its own path to exist at all.

   # ── Qwen3.8-27B NVFP4 · NInfer · VISION · 1 lane (gpu0) ──────────────────────
   # The gpu0 deployment: vision enabled, a single generation lane. Directly comparable to the
   # Qwen3.8-27B Q6_K llama.cpp rows above (same base weights, same silicon) — that comparison is
   # the point of this entry.
   #
   # "NVFP4" is the artifact's weights_id, NOT a uniform 4-bit quant: the manifest inventories only
   # 112 NVFP4 tensors out of 1118, alongside 534 BF16, 208 FP32, 146 FP8_E4M3FN and a group-quant
   # tail (Q4/Q5/Q6 G64). Hence the 20.02 GiB artifact and the ~6.3 bpw below — within a whisker of
   # the Q6_K row's ~22 GB, so read the comparison as "same size class, different engine", not as a
   # 4-bit-vs-6-bit win.
   - hf_repo: unsloth/Qwen3.8-27B-NVFP4     # provenance only (manifest source.quantized) — never fetched
     hf_file: qwen3_8_27b_nvfp4.ninfer      # local filename in the host's artifact_dir
     engine: ninfer
     label: "Qwen3.8-27B NVFP4 [ninfer vision]"
     family: qwen3.8
     type: dense
     arch: gated-delta-dense
     quant: "NVFP4"
     effective_bpw: 6.28                 # MEASURED from the artifact manifest 2026-08-25: 21479607072 tensor
                                         # bytes over 27.36B logical params (the same divisor the 3.8 MLX row
                                         # uses). Mixed-format, see the note above — nominal "4-bit" is wrong
                                         # by 57%, so do not substitute the label for this number.
     total_params: 27
     active_params: 27
     think: optional
     think_control: enable_thinking_top
     no_schema: true
     tools: true                         # VERIFIED live 2026-08-25: function tools accepted, proper tool_calls returned
     native_max_ctx: 262144
     # CORRECTED 2026-08-25. This was recorded as a hard engine ceiling on the reading that
     # --vision forces the window to min(--max-context, 32768). It does not. That 32,768 is the
     # merged-token side of the Vision envelope (P raw patches <= 131,072, V = P/4 <= 32,768) and
     # it bounds how far ONE media item may expand, not the text window: the 27B model doc is
     # explicit that "these Vision columns are not Text token T", and in the runtime the constant
     # appears only as min(capacity, 32768) sizing the vision encoder's workspace and transient
     # output. docs/serving.md calls it "the effective Vision limit", which is what misled this
     # entry. So a vision-enabled instance may serve a text prompt wider than 32k.
     #
     # 32768 therefore stands as a MEMORY choice awaiting measurement, not a ceiling: NVFP4 weights
     # are 20.02 GiB of a 32 GiB V100 and the vision tower is frozen startup residency on top, so
     # the KV that fits is the real question. Raising it means an agent_ctx/maxctx probe on gpu0 and
     # a re-run; until that happens the 32k-depth probes this row is missing (e2e-32k, ttft-32k,
     # quality_decay-32k) are absent because we launched it at 32768, not because they cannot fit.
     ctx_cap: 32768
     kv_variants: []
     extra_flags:
        batch-size: null                 # llama.cpp spellings from defaults.extra_flags — see note 2 above
        ubatch-size: null
        # int8 group-64 KV. This is also start-server.sh's default, stated here so the value that
        # reaches the server is the one recorded as the kv_quant dimension — left implicit, every
        # ninfer row lands with an empty KV column while actually running quantized KV.
        kv-dtype: int8
        vision: true                     # frozen at startup: a text-only instance 400s media rather than degrading
        max-concurrency: 1               # the user's "1 agent on gpu0"; also what makes this row a latency row
        spec: mtp
        draft-tokens: 3
        lm-head-draft: true
     spec_decode: mtp                    # recorded dimension; the extra_flags entries above are what reach the server
     capability_note: "vision-language model served WITH vision enabled (unlike the OptiQ 3.8 row, which serves the same base text-only) — so image input is actually exercised. The 32768 window is a memory choice awaiting measurement, NOT an engine ceiling -- see the corrected ctx_cap note above; the 32,768 merged-token Vision envelope bounds media expansion, not the text window. Perf probes report client-clocked TTFT/decode from SSE: ninfer-serve emits a standard usage block and no llama.cpp timings object, so there is no server-measured prefill/decode split. JSON benches run UNCONSTRAINED (no_schema): response_format is 400 response_format_not_supported on this engine, so triage/reasoning* adherence is not comparable to a constrained llama.cpp row."
     benches: [triage, reasoning, reasoning_hard, reasoning_expert, toolcalling, summarization, docqa, coding_hard, coding_practical, coding_bugfix,
               struct_output, instruction_following, agentic_loop, speed, throughput, prefix_cache, quality_decay]

   # ── Qwen3.6-35B-A3B · NInfer · text-only · multi-lane 64k (gpu1) ─────────────
   # The gpu1 deployment: the agent-fleet row. agent_ctx sweeps --max-concurrency to find how many
   # 64k-deep lanes actually fit, bounded by ninfer's startup-fixed 1..8 (so at most 1 planner +
   # 7 coders — a ceiling the llama.cpp rows do not have; the probe flags when it binds).
   #
   # Text-only deliberately, though no longer for the reason first written here: the DFlash/--vision
   # mutual exclusion stopped applying when this row moved to MTP, and the 27B row runs --vision and
   # --spec mtp together. It stays text-only because --vision is frozen startup residency that would
   # shrink the very fleet this row exists to measure, where decode speed under concurrency matters
   # and image input does not.
   - hf_repo: Qwen/Qwen3.6-35B-A3B          # provenance only — never fetched
     hf_file: qwen3_6_35b_a3b.ninfer
     engine: ninfer
     label: "Qwen3.6-35B-A3B [ninfer]"
     family: qwen3.6
     type: moe
     # From the artifact manifest's weights_id. Mixed-format like the 27B row: 22770245536 tensor
     # bytes over 934 tensors, mostly BF16 with a Q4/Q5/Q6-G64 + W8G32 quantized tail. effective_bpw
     # is deliberately absent — the manifest carries no logical parameter count, and dividing by a
     # nominal "35B" would invent precision the artifact does not state.
     quant: "groupwise-int"
     total_params: 35
     active_params: 3
     think: optional
     think_control: enable_thinking_top
     no_schema: true
     tools: true
     native_max_ctx: 262144
     # 64k for the single-stream benches (throughput/quality_decay depths). It does NOT bound the
     # fleet sweep: agent_ctx evaluates BOTH a 64k-lane and a 128k-lane fleet on this engine (two
     # case_id rows), bounded by native_max_ctx, because lane width is a serving choice and "does a
     # smaller fleet of deep agents fit" is a separate question from "how many working agents fit".
     # 128k exceeds this ceiling, so that row's coherence fill is what says whether the resident
     # tokens are usable as well as allocated.
     ctx_cap: 65536
     kv_variants: []
     extra_flags:
        batch-size: null
        ubatch-size: null
        kv-dtype: int8                   # as above: start-server.sh's default, made explicit so it is recorded
        # SPECULATION HISTORY 2026-08-25 (disabled, then re-enabled at a safe width -- read both
        # halves). The sm_70 speculative VERIFY path is correct only up to
        # THREE draft positions; DFlash runs block 8 (k=7), far outside that, so it produced corrupt
        # output on every long generation -- coherent for ~53-160 tokens, then one token repeated to
        # the budget ceiling ("me me me...", "which which which...").
        #
        # The width boundary was measured on gpu1, this artifact, `--spec mtp --lm-head-draft`,
        # identical prose prompt at temperature 0.0, 4 reps per width: k=1/2/3 are bit-exact
        # reproducible and stop naturally; k=4 collapses 2/4 reps and k=5 collapses 3/4. So this is
        # NOT a DFlash-specific defect and NOT speculation being broken on Volta -- the 27B row is
        # clean because it runs `--draft-tokens 3`, inside the safe region. The diagnostic that
        # proves a defect rather than a sampling artifact is non-reproducibility at temperature 0.0:
        # greedy decode of a fixed prompt must be byte-identical run to run. Watch for the
        # non-repeating variant too -- it never emits EOS and burns the whole budget at ~45 tok/s,
        # which reads as merely slow and inspects as fine.
        #
        # RE-ENABLED 2026-08-25 at the safe width, to benchmark the config anyone would actually
        # deploy. k=3 is the LAST correct width -- do not raise it, and note that the old DFlash
        # k=7 line is gone rather than commented, so it cannot be restored by accident.
        # `--lm-head-draft` is on because it is a win in both directions here (+26% decode on
        # high-acceptance shapes like structured/JSONL, -5% on free prose, both against spec-off),
        # despite the README describing it as an acceptance tradeoff. The spec-off baseline this is
        # measured against is run v100-ninfer-20260825-190750-benchrun, kept for comparison; the
        # two are distinguished in Postgres by the `spec_decode` dimension.
        spec: mtp
        draft-tokens: 3
        lm-head-draft: true
        # max-concurrency is deliberately ABSENT: agent_ctx owns that flag (it strips any value it
        # finds and sweeps its own), and the perf probes should run at the engine default rather
        # than at whichever lane count the fleet search happened to settle on.
     spec_decode: mtp                 # k=3, matching the 27B row's tag; was dflash at k=7 (sm_70 verify path is correct only to k=3 -- see the extra_flags note above)
     capability_note: "served text-only BY CHOICE, not by constraint: this row measures the concurrent text agent fleet, and --vision is frozen-startup residency that would shrink it. The artifact does carry a vision tower (334 objects, same count as the 27B), and the DFlash/--vision mutual exclusion that used to force text-only no longer applies now that speculation is MTP -- the 27B row runs --vision and --spec mtp together. Enabling vision here is therefore possible and would be a separate measurement. Lane count is startup-fixed 1..8 on this engine, so agent_ctx reports a lane-capped result rather than a memory-bound one when it hits 8 lanes. Its fleets are FLAT (planner_ctx == coder_ctx): --max-context is one per-sequence ceiling for every lane, so a wide planner beside narrow coders is not expressible here the way --kv-unified makes it on llama.cpp. Same NInfer caveats as the 27B row: client-clocked SSE timings only (no server timings object), and JSON benches run unconstrained (no_schema) because response_format is rejected."
     benches: [triage, reasoning, reasoning_hard, reasoning_expert, toolcalling, summarization, docqa, coding_hard, coding_practical, coding_bugfix,
               struct_output, instruction_following, agentic_loop, speed, throughput, agent_ctx, prefix_cache, quality_decay]


# ── Sampling matrix ───────────────────────────────────────────────────────────────
# Read by shared/llm/sampling.mjs. Authoritative source for ALL per-request sampling.
# Keyed by model family (matches the `family:` field above).
#
# Structure per family:
#   default:   shared base params applied to all passes (non-thinking models use this alone)
#   think:     delta merged on top of default for think=true passes
#   no_think:  delta merged on top of default for think=false passes
#
# Use-case sub-keys (triage, reasoning, toolcalling, summarization, docqa, longctx, speed)
# override base params for that bench only. State block takes precedence over default.
#
# extra_flags in model entries above are server-launch flags ONLY (speculative decoding etc.).
# All sampling params belong here, including presence_penalty and repeat_penalty.
# There are no fallbacks — every family is explicitly tuned.
#
# Sources (verified from primary HuggingFace model cards, June 2026):
#   qwen3:       https://huggingface.co/Qwen/Qwen3-30B-A3B
#   qwen3-coder: https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct
#   qwen3.6:     https://huggingface.co/Qwen/Qwen3.6-35B-A3B
#   gemma4:      https://ai.google.dev/gemma/docs/core/model_card_4
#   lfm2.5:      https://huggingface.co/LiquidAI/LFM2.5-8B-A1B
#   nemotron:    https://huggingface.co/nvidia/NVIDIA-Nemotron-Nano-12B-v2

sampling_matrix:

   # Overrides live under `per_profile:` and key on a bench's declared samplingProfile, never on a
   # bench name — see shared/llm/sampling.mjs. Unknown profiles fail the run at startup.
   #
   # ── Qwen3 (30B-2507 non-thinking; 14B hybrid) ─────────────────────────────
   # default = no_think base; think delta overrides temp/top_p only.
   # reasoning profile: even in no_think, use higher temp for chain-of-thought prompts. This reaches
   # the `reasoning` bench only — reasoning_hard/reasoning_expert deliberately declare no profile
   # (see benches/reasoning_hard.mjs), which is what they have always effectively done.
   #
   # Dropped 2026-08-16, both dead under the old bench-name lookup and neither ever applied:
   #   longctx — no bench routes through it; benchmarks/longctx/*.mjs never call resolveSampling.
   #   coding  — not re-added: the qwen3.6 A/B below ran 2026-08-16 and came back neutral.
   qwen3:
      default:
         temperature: 0.7
         top_p: 0.8
         top_k: 20
         min_p: 0
         per_profile:
            reasoning:
               temperature: 0.6
               top_p: 0.95
      think:
         temperature: 0.6
         top_p: 0.95

   # ── Qwen3.5 (9B hybrid GatedDeltaNet + sparse MoE) ─────────────────────────
   # Published params mirror Qwen3.6's shape: presence_penalty 1.5 shared; think
   # temp 1.0, no_think temp 0.7 (HF model card). The shared pp 1.5 is the loop guard —
   # canonical rationale in the qwen3.6 block below.
   # No coding profile: the low-temp coding override measured neutral on qwen3.6 (see there).
   qwen3.5:
      default:
         top_k: 20
         min_p: 0
         presence_penalty: 1.5
      think:
         temperature: 1.0
         top_p: 0.95
         per_profile:
            docqa:
               temperature: 0.6
               top_p: 0.95
      no_think:
         temperature: 0.7
         top_p: 0.8

   # ── Qwen3.6 (35B-A3B MoE) ─────────────────────────────────────────────────
   # CANONICAL presence-penalty rationale for the Qwen3.x families — qwen3.5 and qwen3.8 reference
   # this block rather than restating it (they drifted apart once already).
   #
   # presence_penalty=1.5 shared; think uses temp=1.0, no_think uses temp=0.7.
   # docqa in think mode: lower temp for precise arithmetic.
   #
   # DO NOT set presence_penalty 0.0. Qwen's published coding preset (temp 0.6 / pp 0.0) is exactly
   # the config that triggers Qwen3.6-A3B's documented infinite-reasoning-loop bug on coding — the
   # model repeats phrases through the whole think budget and never emits code (QwenLM/Qwen3.6
   # issues #88, #145; HF discussions #19/#20: 17.4% of outputs truncated, 84% of those >30%
   # repetition). Qwen's own mitigation is to RAISE presence_penalty (0–2) to suppress the loop,
   # plus an optional reasoning-budget cap. We keep pp 1.5 AND cap think at 12288
   # (MAX_TOKENS.coding_hard_think).
   #
   # VALIDATED:  pp 1.5 → 100% on all coding passes; pp 0.0 (vendor preset) regressed think →
   #             RUNAWAY. presence_penalty is the variable that A/B actually moved.
   # TESTED, NEUTRAL — do not re-add a coding profile here without new evidence. temp 0.2 / top_p
   #             0.9 was measured against these defaults on 2026-08-16 and made no difference.
   #             An earlier version of this comment read "Verified: pp 1.5 + temp 0.2 → 100%", but
   #             temp 0.2 was NEVER in effect when that ran — the override keyed on a bench named
   #             `coding`, which has not existed since the bench was split into coding_hard/
   #             coding_practical/coding_bugfix. Those passes ran at the family defaults, so the
   #             100% was pp 1.5 plus coding_bugfix sitting at ceiling.
   #
   #             The measurement: Qwen3.6-35B, 4 configs (IQ4_XS + APEX I-Compact × KV q4_0/q5_0).
   #             At n=1 all 24 coding combos moved by −3 net, with bugfix and hard bit-identical in
   #             both arms and every swing confined to coding_practical. Re-run matched at n=5 on
   #             coding_practical (96 cases/arm): 81.2 → 81.8, Δ+0.6, six of eight combos inside
   #             their spread and the two that separate cancelling out. no_code 1.4 → 0.4, think
   #             mode only, ≤0.8 of 12 with ±0.4–0.8 spread — directionally fine, not separable.
   #             Notably the gemma4 failure mode (low-temp coding override → degenerate repetition
   #             running away to the token ceiling) does NOT reproduce on qwen3.6 in think mode.
   #
   #             Both arms are in the store under real sampling hashes: 17886c8e for the profile,
   #             8f2303d0 / 93f3f5ce for these defaults. The pre-2026-08-16 coding rows carry a
   #             NULL sampling_hash and are n=1.
   qwen3.6:
      default:
         top_k: 20
         min_p: 0
         presence_penalty: 1.5
      think:
         temperature: 1.0
         top_p: 0.95
         per_profile:
            docqa:
               temperature: 0.6
               top_p: 0.95
      no_think:
         temperature: 0.7
         top_p: 0.8

   # ── Qwen3.8 (27B dense VLM) ───────────────────────────────────────────────
   # Vendor-published params (HF card, verified 2026-08-15) are IDENTICAL in shape to Qwen3.6's:
   #   think    temp 1.0 / top_p 0.95 / top_k 20 / min_p 0 / presence_penalty 0.0
   #   no_think temp 0.7 / top_p 0.80 / top_k 20 / min_p 0 / presence_penalty 1.5
   # We deliberately DIVERGE from the vendor think-mode presence_penalty 0.0 and keep the shared
   # pp 1.5, exactly as on qwen3.6 — canonical rationale in that block. Qwen's own card names raising
   # presence_penalty (0–2) as the mitigation for endless repetition, so this follows vendor guidance
   # rather than contradicting it.
   #
   # No coding profile: temp 0.2 on coding is running as an experiment on qwen3.6 first (see there).
   # Keeping 3.8 on family defaults for now is what preserves the 3.8-vs-3.6 comparison — both were
   # equally unaffected before, so 3.8 joins only when the rollout does.
   #
   # Also NOT re-verified on 3.8 — if 3.8 fixed the loop bug, the pp 1.5 default is now a needless
   # quality tax and this block should be re-A/B'd against the vendor preset.
   qwen3.8:
      default:
         top_k: 20
         min_p: 0
         presence_penalty: 1.5
      think:
         temperature: 1.0
         top_p: 0.95
         per_profile:
            docqa:
               temperature: 0.6
               top_p: 0.95
      no_think:
         temperature: 0.7
         top_p: 0.8

   # ── Qwen3-Coder (30B-A3B — non-thinking) ──────────────────────────────────
   # Dropped 2026-08-16, both dead under the old bench-name lookup: `longctx` (no bench routes
   # through it) and `coding` (measured neutral on qwen3.6, not re-added — see that block).
   qwen3-coder:
      default:
         temperature: 0.7
         top_p: 0.8
         top_k: 20
         min_p: 0
         repeat_penalty: 1.05

   # ── Gemma 4 (E4B and 26B-A4B) ─────────────────────────────────────────────
   # Google recommends identical params for all tasks and both think states:
   # temp 1.0 / top_p 0.95 / top_k 64. NB: Gemma is calibrated for temp≈1.0 — a
   # LOW-temp coding override (e.g. 0.2) starves it of entropy and causes
   # degenerate repetition/looping, which in think mode runs away to the token
   # ceiling (observed: gemma4-26B/12B coding_hard think → RUNAWAY at temp 0.2).
   # So NO coding override here — Gemma keeps its native temp 1.0, which the
   # community also finds codes best (some use up to 1.5). See model_card_4.
   gemma4:
      default:
         temperature: 1.0
         top_p: 0.95
         top_k: 64

   # ── Nemotron Nano 12B v2 ───────────────────────────────────────────────────
   # no_think = greedy (temp=0) per NVIDIA model card; think and no_think differ
   # entirely so no shared default base.
   nemotron:
      think:
         temperature: 0.6
         top_p: 0.95
      # NVIDIA recommends greedy (temp 0) for no_think, but temp 0 deterministically
      # triggers the llama.cpp peg-native 500 on schema-constrained benches
      # (llama.cpp#24081). A small non-zero temp avoids it at negligible quality cost.
      no_think:
         temperature: 0.3
         top_p: 0.95

   # ── LFM2.5 (always-reasoning, null think state) ────────────────────────────
   # Reasoning trace extracted server-side via --reasoning-format auto.
   lfm2.5:
      default:
         temperature: 0.2
         top_k: 80
         repeat_penalty: 1.05

   # ── Granite 4.0 (IBM recommends near-greedy for instruction following) ──────
   granite:
      default:
         temperature: 0.0
         top_p: 1.0

   # ── Nemotron 3 Nano (mamba-hybrid; no_schema set, but keep temp>0 defensively)
   nemotron3:
      think:
         temperature: 0.6
         top_p: 0.95
      no_think:
         temperature: 0.3
         top_p: 0.95


# ── Host configuration ───────────────────────────────────────────────────────────
# Defined separately in config/hosts.yaml.
# Models run on: rose (llm2) — 2x Tesla V100 PCIe 32GB (64 GiB total)
