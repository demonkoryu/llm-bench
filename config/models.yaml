   # ── Qwen3.6-27B OptiQ 4-bit (OptiQ / mlx-optiq on the M1 Mac) ─────────────────
   # Served by OptiQ (NOT llama.cpp): `engine: optiq` routes it to runners/optiq-server.mjs and keeps
   # it OUT of every rose/llama.cpp run (bench-run engine filter) — it only runs with `--target m1`.
   # OptiQ is mlx-optiq's `optiq serve` (wraps mlx_lm.server with a mixed-precision / fused KV path).
   # No GGUF: hf_file is a synthetic base id (no `.gguf`) so modelBaseId and the gguf_file column stay
   # populated. OptiQ-quantized community 4-bit weights (data-driven mixed-precision), loaded by the daemon.
   #
   # Constraints (user, priority order: max context > performance > quality; ≤1 concurrent client):
   #   --kv-bits 4         → kv_quant: int4 (uniform 4-bit KV; OptiQ's fused KV-quant path is on)
   #   --max-concurrent 1  → single client (agent_ctx MAX_CODERS=0)
   #   --no-auth           → REQUIRED: the OpenAI SDK sends `Bearer EMPTY`, which OptiQ's default auth rejects
   #   --think no_think (harness) → hybrid tested no-think-only (standing rule)
   # OptiQ serves single-model by default: the request `model` is a label, so id resolution is lenient
   # (any value serves --model). mlx_model pins the exact served id so responses echo it truthfully.
   # Architecture: same base as the community Qwen3.6-27B — model_type qwen3_5_text, 64 layers =
   # 48 linear_attention + 16 full_attention → GatedDeltaNet hybrid (arch: gated-delta-dense). Only
   # 16/64 layers hold a GROWING KV cache, so deep context is memory-cheap → native 262k plausible.
   # ctx_cap is a FRESH seed for OptiQ (the RapidMLX int4 64k ceiling does NOT transfer — different
   # quant + serving stack, and the caps-cache key uses backend=optiq); agent_ctx (run FIRST)
   # re-measures the coherence_ceiling for the depth probes. extra_flags null llama.cpp batch defaults.
   # Excludes kv_per_tok/fit_ctx (VRAM/llama.cpp-only) and parallel_gen (violates 1-client).
   # NOTE: OptiQ's natural secondary A/B is mixed-precision KV (`optiq kv-cache <model> --target-bits N`
   # → --kv-config kv_config.json) vs this uniform --kv-bits 4 — the OptiQ analog of the old RapidMLX
   # pflash A/B. Deferred; add a disabled `[kv-mixed]` variant when running it.
   - hf_repo: mlx-community/Qwen3.6-27B-OptiQ-4bit
     hf_file: Qwen3.6-27B-OptiQ-4bit
     engine: optiq
     mlx_model: mlx-community/Qwen3.6-27B-OptiQ-4bit
     kv_quant: int4
     label: "Qwen3.6-27B OptiQ 4bit [kv int4]"
     family: qwen3.6
     type: dense
     arch: gated-delta-dense
     quant: "OptiQ-4bit"
     effective_bpw: 5.58                 # MEASURED 2026-08-16 from the safetensors headers, not nominal: 17875 MB
                                         # of served text weights over 26.90B logical params. See the 3.8 OptiQ
                                         # entry for how this is derived and why the old 4.5 was wrong.
     total_params: 27
     active_params: 27
     think: optional
     think_control: enable_thinking
     tools: true
     native_max_ctx: 262144              # config.json max_position_embeddings (real trained window — kept truthful)
     probe_max_ctx: 65536                # agent_ctx climb cap: operator LOCKED deploy at 1×64k slot (2026-07-22) and explicitly abandoned 128k ("128k is just too slow" — user). Single-stream int4 KV does fit ~25GB @128k, but 128k decode is prohibitively slow at ~13 tok/s and provides no operational benefit over the locked 64k slot, so cap the probe at 64k. native_max_ctx (262144) stays truthful.
     ctx_cap: 65536                      # FRESH seed / conservative start rung for OptiQ int4 KV; agent_ctx (run first) climbs from here toward probe_max_ctx and writes measured coherence_ceiling
     kv_variants: []
     extra_flags: { batch-size: null, ubatch-size: null }
     # Operational caveat (measured 2026-07-22): prefix-cache reuse is NIL — prefix_cache_speedup ≈ 1.0
     # (cold 119694ms ≈ warm 119542ms). OptiQ's int4-KV requant defeats mlx_lm's prompt-cache, so every
     # multi-turn request re-prefills the full context (~18min per 64k turn at ~60 tok/s prefill).
     capability_note: "prefix-cache reuse nil on int4-KV path (speedup≈1.0): every turn re-prefills the full context; also perf probes report wall-clock e2e tok/s only (mlx_lm emits no server timings, so no prefill/decode split). triage JSON now healthy: mlx_lm constrains via Outlines, which mis-compiles null-as-enum-member (truncated JSON, 18/18 fail) — fixed 2026-07-23 by the shared anyOf[{enum},{null}] schema encoding (see results/optiq-schema-outlines.md)"
     benches: [triage, reasoning, toolcalling, summarization, docqa, coding_hard, coding_practical, coding_bugfix, struct_output, instruction_following, agentic_loop, agent_ctx, quality_decay, throughput, speed, prefix_cache]

   # ── Qwen3.8-27B MLX 4-bit (stock uniform quant on the M1 Mac) ────────────────
   # Successor generation to the Qwen3.6-27B OptiQ entry above. Same serving stack (`engine: optiq`
   # → runners/optiq-server.mjs, `optiq serve` wrapping mlx_lm.server, --kv-bits 4), so every
   # operational note on that entry applies here unless contradicted below.
   #
   # QUANT IS NOT COMPARABLE TO THE 3.6 OptiQ ENTRY. This is mlx-community's uniform affine 4-bit —
   # OptiQ's sensitivity-aware mixed precision is a per-layer bit assign, and on 3.5-27B it beat stock
   # uniform 4-bit on every Capability-Score metric. So a 3.8-vs-3.6 diff measured against the OptiQ
   # row conflates GENERATION with QUANT. The `Qwen3.6-27B MLX 4bit` entry below is the matched-quant
   # control that isolates the generation delta; run it alongside.
   # This entry is NOT superseded by the 3.8 OptiQ entry that follows — keep both: stock-vs-stock is
   # one matched pair (with the 3.6 control below) and OptiQ-vs-OptiQ is the other (with the 3.6 OptiQ
   # entry above). Together they also give the quant delta within each generation.
   #
   # ALL THREE OPEN RISKS ON THIS ENTRY ARE NOW CLOSED (was "UNVERIFIED — smoke before trusting a run"):
   #   - 3.8-27B is a native VISION-language model and these weights were converted with `mlx_vlm`
   #     (mlx-vlm 0.6.8), not `mlx_lm`, which OptiQ wraps. mlx_lm DOES load the checkpoint text-only —
   #     verified by the 2026-08-15 run, 28/28 benches ok. No mlx-vlm install or alternate serve path.
   #   - native_max_ctx 262144 verified 2026-08-16 against the local config.json, not copied from 3.6.
   #   - effective_bpw measured 2026-08-16 (4.69, not the nominal 4.0) — see the note on the field.
   # probe_max_ctx/ctx_cap inherit the operator's LOCKED 1×64k deploy slot (2026-07-22, "128k is just
   # too slow") — not a fresh measurement. agent_ctx (run FIRST) re-measures coherence_ceiling.
   - hf_repo: mlx-community/Qwen3.8-27B-4bit
     hf_file: Qwen3.8-27B-4bit
     engine: optiq
     mlx_model: mlx-community/Qwen3.8-27B-4bit
     kv_quant: int4
     label: "Qwen3.8-27B MLX 4bit [kv int4]"
     family: qwen3.8
     type: dense
     arch: gated-delta-dense           # 64 layers = 48 linear_attention + 16 full_attention (as 3.5/3.6)
     quant: "MLX-4bit"
     effective_bpw: 4.69               # MEASURED 2026-08-16: 15310 MB over 27.36B logical params. "4-bit" is the
                                       # nominal weight width; the real figure carries the group-64 affine
                                       # scales+biases (fp16 pair per 64 weights = +0.5 bpw) plus the tensors left
                                       # unquantized. Identical byte-for-byte to the 3.6 stock entry below.
     total_params: 27
     active_params: 27
     think: optional
     think_control: enable_thinking    # card: thinking mode is the DEFAULT — harness forces no_think (standing rule)
     tools: true
     native_max_ctx: 262144            # VERIFIED 2026-08-16 from the local config.json (max_position_embeddings).
                                       # The card's 1M figure applies to the HOSTED variant only.
     probe_max_ctx: 65536
     ctx_cap: 65536
     kv_variants: []
     extra_flags: { batch-size: null, ubatch-size: null }
     capability_note: "vision-language model served text-only (mlx_vlm-converted weights load fine under OptiQ/mlx_lm — VERIFIED by the 2026-08-15 run, 28/28 benches ok). Same OptiQ operational caveats as the 3.6 OptiQ entry: prefix-cache reuse nil on the int4-KV path (every turn re-prefills), and wall-clock e2e tok/s only (mlx_lm emits no server timings, so no prefill/decode split)."
     benches: [triage, reasoning, toolcalling, summarization, docqa, coding_hard, coding_practical, coding_bugfix, struct_output, instruction_following, agentic_loop, agent_ctx, quality_decay, throughput, speed, prefix_cache]

   # ── Qwen3.8-27B OptiQ 4-bit (matched-QUANT counterpart to the 3.6 OptiQ entry) ──
   # Landed 2026-08-15 (repo created 03:39Z, card finalised 08-16). This is the row that closes the
   # comparison the stock-4bit entry above could not: 3.8 OptiQ vs 3.6 OptiQ holds the quant recipe
   # constant across generations, exactly as the 3.6/3.8 stock-4bit pair holds the stock recipe.
   # Card facts (2026-08-16): 498 quantized tensors — 261 at 8-bit (sensitive) / 237 at 4-bit (robust),
   # group size 64, 19.0 GB on disk, per-layer bits chosen by a KL sensitivity sweep against a
   # uniform-4-bit reference (bf16 does not fit 36 GB, so the reference is itself quantized — the
   # sensitivity ranking is therefore relative, not absolute). Tensor count is high because 48 of the
   # 64 blocks are linear-attention with five projections each.
   # Vision tower stays bf16 in optiq/optiq_vision.safetensors (0.9 GB) → the repo loads TEXT-ONLY
   # under stock mlx_lm, image+text only under OptiQ. We serve text-only, same as every other M1 row.
   # SIDECAR LAYOUT: this repo uses the newer optiq/ subfolder (optiq/metadata.json,
   # optiq/optiq_vision.safetensors). Verified 2026-08-16 that the installed mlx-optiq 0.4.2 resolves
   # both layouts (optiq/sidecar_layout.py checks the subfolder first, then the legacy root), so no
   # toolchain upgrade is required to serve it — and deliberately none was done, because bumping
   # mlx-optiq would change the serving stack under the already-recorded 3.6 OptiQ rows and confound
   # the generation comparison this entry exists to make.
   # NO PUBLISHED NUMBERS: the card's Capability Score table is explicitly unfilled ("No numbers are
   # quoted until that run completes"), so there is nothing upstream to sanity-check our results against.
   - hf_repo: mlx-community/Qwen3.8-27B-OptiQ-4bit
     hf_file: Qwen3.8-27B-OptiQ-4bit
     engine: optiq
     mlx_model: mlx-community/Qwen3.8-27B-OptiQ-4bit
     kv_quant: int4
     label: "Qwen3.8-27B OptiQ 4bit [kv int4]"
     family: qwen3.8
     type: dense
     arch: gated-delta-dense           # 64 layers = 48 linear_attention + 16 full_attention (as 3.5/3.6)
     quant: "OptiQ-4bit"
     effective_bpw: 5.78               # MEASURED 2026-08-16: 18525 MB over 26.90B logical params.
                                       # NOT equal to the 3.6 OptiQ figure (5.58) — the two OptiQ quants differ by
                                       # ~3.6%, so this axis is NOT symmetric and does not cancel in a 3.8-vs-3.6
                                       # OptiQ comparison: the 3.8 quant is genuinely fatter, and any quality edge
                                       # it shows is bought with bits. Bytes are the safetensors index total_size
                                       # (sharded text tower only); the optiq/ sidecars are excluded because they
                                       # are on disk but never loaded on the text-only path we serve. Logical param
                                       # count comes from each tensor's .scales shape ([out, n_groups] × group_size),
                                       # which is bit-width agnostic — the packed uint32 weight shapes are not, since
                                       # OptiQ varies bits per layer. Reproduce on llm1:
                                       #   python3 scripts/llm1/bpw.py Qwen3.8-27B-OptiQ-4bit Qwen3.6-27B-OptiQ-4bit
                                       # CAVEAT on OptiQ-vs-STOCK: the two cover slightly different tensor sets.
                                       # Stock shards carry a quantized vision tower (27.36B logical params); the
                                       # OptiQ index excludes it (26.90B — vision is bf16 in the sidecar). So the
                                       # ~0.46B difference is vision, and the QUANT delta (4.69 vs 5.58/5.78) is not
                                       # strictly like-for-like. Cross-generation comparisons within one recipe
                                       # (stock-vs-stock, OptiQ-vs-OptiQ) are unaffected.
     total_params: 27
     active_params: 27
     think: optional
     think_control: enable_thinking    # card default is thinking — harness forces no_think (standing rule)
     tools: true
     native_max_ctx: 262144            # VERIFIED 2026-08-16 from the local config.json (max_position_embeddings).
                                       # The card's 1M figure applies to the HOSTED variant only.
     probe_max_ctx: 65536
     ctx_cap: 65536
     kv_variants: []
     extra_flags: { batch-size: null, ubatch-size: null }
     capability_note: "vision-language model served text-only (bf16 vision tower left in the optiq/ sidecar). Same OptiQ caveats as the other M1 rows: prefix-cache reuse nil on the int4-KV path (every turn re-prefills), wall-clock e2e tok/s only."
     benches: [triage, reasoning, toolcalling, summarization, docqa, coding_hard, coding_practical, coding_bugfix, struct_output, instruction_following, agentic_loop, agent_ctx, quality_decay, throughput, speed, prefix_cache]

