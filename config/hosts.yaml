# Endpoint config per target host.
# Override via env: LLAMA_URL, SSH_HOST, BACKEND
#
# Backend:
#   CUDA via containerized llama.cpp (Docker + nvidia-container-toolkit).
#   The harness auto-detects via scripts/llm2/backends.sh.

rose:
   label: "rose / 2x Tesla V100 PCIe 32GB"
   gpu: "V100"                         # slugged into result CSV filenames (→ v100)
   vram_total_mib: 65536               # 2x 32768 MiB
   llamacpp: "${LLAMA_URL:-http://192.168.1.120:8090}"
   ssh_host: "${SSH_HOST:-llm2}"
   port: 8090
   backends:
      cuda:
         image: "llama-server-cuda"
   remote_dir: "~/llm-bench"
   vram_cmd: "nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits"

# ── m1 / Apple M1 Mac — OptiQ (MLX) ──────────────────────────────────────────────
# A persistent OptiQ daemon (`optiq serve`) on the M1 Mac. Selected only with `--target m1`;
# the bench-run engine filter keeps MLX models off rose and vice-versa.
# engine: optiq routes the model server to runners/optiq-server.mjs (no-op lifecycle: the daemon
# is long-lived and has no server-reload context flag — it is NOT launched or killed by the harness,
# only health-checked + model-selected via GET /v1/models). OptiQ serves single-model by default, so
# the request `model` field is just a label (any value serves the loaded --model).
# Unified memory: NO VRAM readout (no rocm-smi), so vram_cmd is intentionally absent —
# kv_per_tok / fit_ctx skip cleanly and agent_ctx uses the client-driven MLX probe.
# DEPLOYMENT: bench-run runs ON llm1 from the ~/llm-bench git checkout (deploy via commit→push→
# `scripts/deploy.sh --host llm1`), talking to the local OptiQ daemon — hence the loopback URL.
# The daemon is launched separately on llm1 by scripts/llm1/serve.sh. See README §4a.
# (Replaced RapidMLX 2026-07-22; the archived RapidMLX runner/serve script live under archive/rapidmlx/.)
m1:
   label: "m1 / Apple M1 (32 GB unified)"
   gpu: "M1"
   engine: optiq
   backend: optiq                     # distinct from purged omlx (backend: mlx) and archived rapidmlx rows
   mlx: "${MLX_URL:-http://127.0.0.1:8080}"   # bench-run runs locally on llm1 → loopback
   ssh_host: "${SSH_HOST_M1:-llm1}"
   port: 8080
   remote_dir: "~/llm-bench"

# ── rose / NInfer (ninfer-v100, sm_70 Volta port) ────────────────────────────────
# https://github.com/geoffwatts/ninfer-v100 — a from-scratch C++/CUDA engine, single-GPU by
# design ("specialized for one Tesla V100 and one CUDA device"). So rose runs TWO independent
# ninfer-serve instances, one per card, declared as two targets that differ only in `device`,
# `port` and URL. engine: ninfer routes to runners/ninfer-server.mjs, which launches/stops the
# instance per model like llama.cpp (unlike the persistent OptiQ daemon) via the per-device
# scripts under scripts/llm2/ninfer/.
#
# Weights are single pre-converted .ninfer artifacts staged out of band in artifact_dir — there
# is no llama.cpp-style HF auto-fetch — so models.yaml carries the filename in `hf_file` and
# `hf_repo` only records provenance.
#
# The two cards are identical V100s, so `device` is NOT a measurement dimension and rows from
# either target are directly comparable. The split exists solely so the two deployments can be
# measured CONCURRENTLY without contending for one GPU. Pick which model goes where with
# --models; an unfiltered run would serve both artifacts sequentially on the one card, which is
# a valid measurement, just not a parallel one.
rose-ninfer0:
   label: "rose / Tesla V100 #0 — NInfer"
   gpu: "V100"                         # same slug as the llama.cpp rows: same silicon, comparable
   vram_total_mib: 32768               # ONE card — this instance cannot reach the peer's memory
   engine: ninfer
   backend: ninfer
   device: 0
   ninfer: "${NINFER_URL_0:-http://192.168.1.120:8100}"
   ssh_host: "${SSH_HOST:-llm2}"
   port: 8100
   artifact_dir: "~/models/ninfer"
   image: "ninfer-v100:latest"         # build.sh also tags :<source-commit>; engine_version reads
                                       # the ninfer.source.commit label off the running container,
                                       # so the floating tag never blurs which build was measured
   remote_dir: "~/llm-bench"
   vram_cmd: "nvidia-smi -i 0 --query-gpu=memory.used --format=csv,noheader,nounits"

rose-ninfer1:
   label: "rose / Tesla V100 #1 — NInfer"
   gpu: "V100"
   vram_total_mib: 32768
   engine: ninfer
   backend: ninfer
   device: 1
   ninfer: "${NINFER_URL_1:-http://192.168.1.120:8101}"
   ssh_host: "${SSH_HOST:-llm2}"
   port: 8101
   artifact_dir: "~/models/ninfer"
   image: "ninfer-v100:latest"
   remote_dir: "~/llm-bench"
   vram_cmd: "nvidia-smi -i 1 --query-gpu=memory.used --format=csv,noheader,nounits"
